job:
  name: hello-cron
  image: alpine:3.20
  command: "sh -c 'echo hello from $(hostname); sleep 2'"
  nodes: 2
  timeout_minutes: 10
  on_failure: fail-fast

  env:
    - name: TEST_MODE
      value: smoke

  infra:
    provider: aws
    instance_type: t3.large
    region: ap-southeast-2
    spot: true
    ttl_minutes: 60

  storage:
    type: s3
    # Your S3 logs bucket. Run scripts/verify-aws.sh — it prints the exact
    # bucket name for your account — then set it here.
    bucket: openbench-logs-replace-me
    path_prefix: hello-cron/{run_id}/

  trigger:
    type: cron
    cron_schedule: "0 2 * * *"